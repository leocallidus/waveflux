name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-linux:
    name: Test (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git cmake ninja gcc pkgconf \
            qt6-base qt6-declarative qt6-multimedia \
            kirigami qqc2-desktop-style breeze-icons kcoreaddons ki18n \
            gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad \
            libopenmpt taglib xorg-server-xvfb

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON

      - name: Build
        run: |
          cmake --build build -j$(nproc)

      - name: Run Tests
        run: |
          xvfb-run -a ctest --test-dir build --output-on-failure
