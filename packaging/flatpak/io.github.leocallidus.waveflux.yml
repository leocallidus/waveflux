app-id: io.github.leocallidus.waveflux
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: waveflux

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro
  - --filesystem=/run/media:ro
  - --filesystem=/media:ro
  - --own-name=org.mpris.MediaPlayer2.waveflux
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: libopenmpt
    buildsystem: autotools
    config-opts:
      - --disable-examples
      - --disable-openmpt123
      - --disable-static
      - --disable-tests
      - --without-portaudio
      - --without-portaudiocpp
    cleanup:
      - /include
      - '*.la'
      - /lib/pkgconfig
      - /share/doc
    sources:
      - type: archive
        url: https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.8.9+release.autotools.tar.gz
        sha256: d7ce84fd05d686c4bcf66af40eae857afa371442db60eeda3f874bd6cf6fc318

  - name: waveflux
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DWAVEFLUX_ENABLE_DBUS_INTEGRATION=ON
    post-install:
      - install -Dm644 packaging/flatpak/io.github.leocallidus.waveflux.desktop /app/share/applications/io.github.leocallidus.waveflux.desktop
      - install -Dm644 packaging/flatpak/io.github.leocallidus.waveflux.metainfo.xml /app/share/metainfo/io.github.leocallidus.waveflux.metainfo.xml
      - install -Dm644 resources/icons/waveflux.svg /app/share/icons/hicolor/scalable/apps/io.github.leocallidus.waveflux.svg
    sources:
      - type: dir
        path: ../..
