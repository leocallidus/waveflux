name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-linux:
    name: Test (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkgconf \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-tools-dev \
            libqt6core6t64 libqt6gui6 libqt6widgets6 libqt6qml6 libqt6quick6 libqt6multimedia6 libqt6sql6 libqt6dbus6 \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtcore qml6-module-org-kde-kirigami \
            extra-cmake-modules libkirigami-dev libkf6coreaddons-dev libkf6i18n-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libopenmpt-dev libtag1-dev xvfb

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON

      - name: Build
        run: |
          cmake --build build -j$(nproc)

      - name: Run Tests
        run: |
          xvfb-run --auto-servernum ctest --test-dir build --output-on-failure
